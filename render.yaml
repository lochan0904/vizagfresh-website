databases:
  - name: vizagfresh-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: vizagfresh-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npx knex --knexfile src/db/knexfile.js migrate:latest && npx knex --knexfile src/db/knexfile.js seed:run && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vizagfresh-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: CLIENT_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        value: admin@vizagfresh.in
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: WHATSAPP_NUMBER
        value: "919999999999"

  - type: web
    name: vizagfresh-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
